<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimulateAI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>SimulateAI</h1>
    <span class="meta"></span>
  </header>

  <section>
    <h2>New Simulation</h2>
    <form>
      <textarea id="stimulus" placeholder="Describe the scenario to simulate..." required></textarea>
      <div class="form-row">
        <label>Agents <input type="number" id="agents" value="5" min="1" max="100"></label>
        <label>Provider
          <select id="provider">
            <option value="gemini">gemini</option>
            <option value="openai">openai</option>
            <option value="ollama">ollama</option>
          </select>
        </label>
        <label>Depth
          <select id="depth">
            <option value="quick">quick</option>
            <option value="standard" selected>standard</option>
            <option value="deep">deep</option>
          </select>
        </label>
        <label>RAG
          <select id="rag">
            <option value="">auto</option>
            <option value="true">on</option>
            <option value="false">off</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <label>Crisis override <input type="text" id="crisis" class="wide" placeholder="(optional) custom crisis event"></label>
      </div>
      <button type="submit">Run Simulation</button>
    </form>
  </section>

  <section id="status">
    <h2>Status</h2>
    <div class="status-line"><span class="dot"></span>queued</div>
  </section>

  <section id="result">
    <h2>Result</h2>
    <div class="result-body"></div>
  </section>

  <section>
    <h2>History</h2>
    <table id="history-table">
      <thead>
        <tr><th>ID</th><th>Scenario</th><th>Verdict</th><th>Time</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="4" class="empty-state">No runs yet</td></tr>
      </tbody>
    </table>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
