name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint runtime
        run: ruff check config.py server.py src
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Compile smoke test
        run: python -m compileall -q config.py server.py src tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t simulateai:ci .
      - name: Start container
        run: docker run -d --name simulateai -p 8000:8000 -e RAG_ENABLED=false simulateai:ci
      - name: Readiness smoke test
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/readiness; then exit 0; fi
            sleep 1
          done
          docker logs simulateai
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f simulateai || true
