services:
  app:
    build:
      context: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8000}"
    restart: unless-stopped
    init: true
    volumes:
      - run_data:/app/tests/runs
      - app_data:/app/data

volumes:
  run_data:
  app_data:
